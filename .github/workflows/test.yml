# Build everything and run the tests: the native x86 self-tests and gzip decoder
# in the Docker build image, then the WebAssembly engine and the JIT tests in
# the emsdk image.
name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the build image
        run: docker compose build build
      - name: Self-tests, inflate test, release binaries
        run: |
          docker compose run --rm -T --entrypoint bash build -c '
            set -e
            make clean
            make x86-selftest && ./x86-selftest
            make inflate-test && sh tests/inflate_test.sh ./inflate-test
            make dist
            make clean'
      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: dist/

  wasm:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.74
    steps:
      - uses: actions/checkout@v4
      - name: Build the engine
        run: make -f Makefile.js
      - name: JIT tests (selftest with every block compiled, fuzzer, microbench)
        run: sh tests/x86_jit_test.sh 500 1
      - uses: actions/upload-artifact@v4
        with:
          name: wasm
          path: dist/wasm/
