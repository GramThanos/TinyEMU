/* Alpine Linux i686 boot config for the software x86 CPU.
 * Kernel + 9p root filesystem are fetched over the network (Bellard's jslinux
 * assets). Console is the virtio console (hvc0), which is the one temu wires to
 * stdin/stdout, so the shell is interactive. Requires a CONFIG_FS_NET build
 * (dist/linux/temu-soft is built that way). */
{
    version: 1,
    machine: "pc",
    memory_size: 256,
    kernel: "https://bellard.org/jslinux/kernel-x86.bin",
    cmdline: "console=hvc0 loglevel=4 root=root rootfstype=9p rootflags=trans=virtio ro",
    fs0: { file: "https://vfsync.org/u/os/alpine-x86" },
    eth0: { driver: "user" },
}
